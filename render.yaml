# Blueprint Render + Neon PostgreSQL — Farma Express
#
# Base de Datos Neon (smart-medic / farmaexpress):
# DATABASE_URL (con pooling): postgresql://neondb_owner:npg_6otjSrwAy8hs@ep-small-fire-atder57k-pooler.c-9.us-east-1.aws.neon.tech/farmaexpress?sslmode=require&channel_binding=require
# DIRECT_URL (sin pooling):   postgresql://neondb_owner:npg_6otjSrwAy8hs@ep-small-fire-atder57k.c-9.us-east-1.aws.neon.tech/farmaexpress?sslmode=require&channel_binding=require

services:
  # ─── API NestJS ───
  - type: web
    name: farmaexpress-api
    runtime: docker
    dockerfilePath: backend-nestjs/Dockerfile
    dockerContext: backend-nestjs
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        value: admin@farmaexpress.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_SCAN_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_SCAN_MODEL
        value: gemini-2.0-flash-lite
      - key: PUBLIC_API_URL
        fromService:
          type: web
          name: farmaexpress-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: RAPIDAPI_KEY
        sync: false

  # ─── Flutter Web (nginx) ───
  - type: web
    name: farmaexpress
    runtime: docker
    dockerfilePath: deploy/Dockerfile.render-web
    dockerContext: .
    plan: free
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: farmaexpress-api
          envVarKey: RENDER_EXTERNAL_URL
